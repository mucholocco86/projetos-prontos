name: Publicar WELLS CONECT final aprovado
run-name: Sincronizar release final WELLS CONECT e documentação
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/publicar-wells-conect.yml']
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Obter catálogo
        uses: actions/checkout@v4
      - name: Obter código-fonte exato da versão aprovada
        uses: actions/checkout@v4
        with:
          repository: mucholocco86/fisicos
          ref: 5cb2452291f85c40245048b2b67598b2a004fb94
          path: wells-src
          persist-credentials: false
      - name: Baixar pacote Windows e APK já compilados e testados
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/mucholocco86/fisicos/actions/artifacts/13985769985/zip" \
            --output WELLS-CONECT-Windows-Qt6-scrcpy-5.0.1.zip
          unzip -t WELLS-CONECT-Windows-Qt6-scrcpy-5.0.1.zip >/dev/null
          for item in WellsConect.exe wells-audio.apk wells_audio.bat Qt6Multimedia.dll adb.exe scrcpy-server; do
            unzip -Z -1 WELLS-CONECT-Windows-Qt6-scrcpy-5.0.1.zip | grep -Fxq "$item" || { echo "Faltando: $item"; exit 1; }
          done
          if unzip -Z -1 WELLS-CONECT-Windows-Qt6-scrcpy-5.0.1.zip | grep -Eq '^(sndcpy.apk|sndcpy.bat)$'; then
            echo "Arquivos sndcpy antigos indevidamente presentes"; exit 1
          fi
          git -C wells-src archive --format=zip --output="$GITHUB_WORKSPACE/WELLS-CONECT-CODIGO-FONTE.zip" HEAD upstream/QtScrcpy wells-audio-android .github/workflows/wells-audio-package.yml .github/workflows/wells-audio-android.yml
          unzip -t WELLS-CONECT-CODIGO-FONTE.zip >/dev/null
          sha256sum WELLS-CONECT-Windows-Qt6-scrcpy-5.0.1.zip WELLS-CONECT-CODIGO-FONTE.zip
      - name: Substituir a publicação oficial vigente
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload wells-conect-v1.0.0 \
            WELLS-CONECT-Windows-Qt6-scrcpy-5.0.1.zip \
            WELLS-CONECT-CODIGO-FONTE.zip \
            --clobber --repo mucholocco86/projetos-prontos
          gh release edit wells-conect-v1.0.0 \
            --repo mucholocco86/projetos-prontos \
            --title 'WELLS CONECT — final aprovado com Wells Audio' \
            --notes-file finalizados/WELLS-CONECT/README.md \
            --latest
          gh release view wells-conect-v1.0.0 --repo mucholocco86/projetos-prontos --json assets,url
