name: Arquivar WELLS CONECT final aprovado
run-name: Publicar somente WELLS CONECT aprovado (compilação 49)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/publicar-wells-conect.yml']
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Obter catálogo
        uses: actions/checkout@v4
      - name: Obter fontes EXATAS da versão aprovada
        uses: actions/checkout@v4
        with:
          repository: mucholocco86/fisicos
          ref: 68615d07d4e5d28dc28423db329f8501e8e2f831
          path: wells-src
          persist-credentials: false
      - name: Baixar pacote compilado e aprovado, sem recompilar
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/mucholocco86/fisicos/actions/artifacts/13837826459/zip" \
            --output WELLS-CONECT-Windows-Qt6-scrcpy-5.0.1.zip
          echo "Validando ZIP do build #49..."
          unzip -t WELLS-CONECT-Windows-Qt6-scrcpy-5.0.1.zip >/dev/null
          for item in WellsConect.exe sndcpy.apk sndcpy.bat Qt6Core.dll Qt6Multimedia.dll adb.exe scrcpy-server WELLS_CONECT_ICON.ico; do
            unzip -Z -1 WELLS-CONECT-Windows-Qt6-scrcpy-5.0.1.zip | grep -Fxq "$item" || { echo "Faltando: $item"; exit 1; }
          done
          sha256sum WELLS-CONECT-Windows-Qt6-scrcpy-5.0.1.zip
          git -C wells-src archive --format=zip --output="$GITHUB_WORKSPACE/WELLS-CONECT-CODIGO-FONTE.zip" HEAD upstream/QtScrcpy .github/workflows/wells-core-qt6.yml
          unzip -t WELLS-CONECT-CODIGO-FONTE.zip >/dev/null
          echo "Artefato e fontes do commit aprovado verificados."
      - name: Atualizar a única publicação oficial, substituindo arquivos antigos
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload wells-conect-v1.0.0 \
            WELLS-CONECT-Windows-Qt6-scrcpy-5.0.1.zip \
            WELLS-CONECT-CODIGO-FONTE.zip \
            --clobber --repo mucholocco86/projetos-prontos
          gh release edit wells-conect-v1.0.0 \
            --repo mucholocco86/projetos-prontos \
            --title 'WELLS CONECT — versão final aprovada (Qt6 + áudio sincronizado)' \
            --notes-file finalizados/WELLS-CONECT/README.md \
            --latest
          gh release view wells-conect-v1.0.0 --repo mucholocco86/projetos-prontos --json assets,url
